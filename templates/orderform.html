{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block title %}
    Order Form
{% endblock  %}

{% block main-content %}

    <div class="container my-5" id='orderform'>
        <div class="col-md-7 m-auto shadow p-3 rounded-4">
            <h2 class="text-center">Order Form</h2>
            <form method="post">
                {% csrf_token %}
                {{ form | crispy }}

                <div class="button text-center">
                    <input type="submit" value="Checkout" class="btn btn-success my-2">
                </div>
            </form>
        </div>

    </div>
{% endblock  %}

{% block script %}

{% endblock  %}
