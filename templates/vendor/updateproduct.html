{% extends "layout.html" %}
{% load crispy_forms_tags %}

{% block title %}
    Update Product
{% endblock  %}

{% block main-content %}
    <div class="container my-5" id='updateproduct'>
        <div class="col-md-7 m-auto shadow p-3 rounded-4">
            <h2 class="text-center">Update Product</h2>
            <form action="#" method="post" autocomplete="off"enctype="multipart/form-data">
                {% csrf_token %}
                {{ form | crispy }}

                <div class="button text-center">
                    <input type="submit" value="save" class="btn btn-warning">
                </div>
            </form>
        </div>

    </div>
{% endblock  %}

{% block script %}

{% endblock  %}
